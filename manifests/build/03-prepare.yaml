apiVersion: batch/v1
kind: Job
metadata:
  name: pelias-prepare-polylines
  labels:
    app.kubernetes.io/part-of: pelias
    app.kubernetes.io/component: build
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: pelias
        app.kubernetes.io/component: build
        pelias.io/data-group: prepare
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pelias-prepare-polylines
        image: pelias/polylines:master
        command:
        - bash
        - ./docker_extract.sh
        env:
        - name: PELIAS_CONFIG
          value: /code/pelias.json
        volumeMounts:
        - name: config
          mountPath: /code/pelias.json
          subPath: pelias.json
          readOnly: true
        - name: data
          mountPath: /data
          readOnly: false
        - name: scratch
          mountPath: /tmp
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: pelias-config
      - name: data
        persistentVolumeClaim:
          claimName: pelias-data
      - name: scratch
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes:
              - ReadWriteOnce
              storageClassName: pitt-vcf-vks-storage-policy-latebinding
              resources:
                requests:
                  storage: 5Gi
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                pelias.io/data-group: prepare
            topologyKey: kubernetes.io/hostname
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pelias-prepare-placeholder
  labels:
    app.kubernetes.io/part-of: pelias
    app.kubernetes.io/component: build
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: pelias
        app.kubernetes.io/component: build
        pelias.io/data-group: prepare
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pelias-prepare-placeholder
        image: pelias/placeholder:master
        command:
        - sh
        - -c
        - ./cmd/extract.sh && ./cmd/build.sh
        env:
        - name: PELIAS_CONFIG
          value: /code/pelias.json
        volumeMounts:
        - name: config
          mountPath: /code/pelias.json
          subPath: pelias.json
          readOnly: true
        - name: data
          mountPath: /data
          readOnly: false
        - name: blacklist
          mountPath: /data/blacklist/osm.txt
          subPath: osm.txt
          readOnly: true
        - name: scratch
          mountPath: /tmp
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            memory: 2Gi
            ephemeral-storage: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: pelias-config
      - name: data
        persistentVolumeClaim:
          claimName: pelias-data
      - name: blacklist
        configMap:
          name: pelias-osm-blacklist
      - name: scratch
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes:
              - ReadWriteOnce
              storageClassName: pitt-vcf-vks-storage-policy-latebinding
              resources:
                requests:
                  storage: 5Gi
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                pelias.io/data-group: prepare
            topologyKey: kubernetes.io/hostname
---
