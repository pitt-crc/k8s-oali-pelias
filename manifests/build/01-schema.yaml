apiVersion: batch/v1
kind: Job
metadata:
  name: pelias-schema-create
  labels:
    app.kubernetes.io/part-of: pelias
    app.kubernetes.io/component: build
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: pelias
        app.kubernetes.io/component: build
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pelias-schema-create
        image: pelias/schema:master
        command:
        - sh
        - -c
        # An existing index counts as success; any other error still fails the Job
        - |
          out=$(./bin/create_index 2>&1); rc=$?
          echo "$out"
          [ "$rc" -eq 0 ] || echo "$out" | grep -q resource_already_exists_exception
        env:
        - name: PELIAS_CONFIG
          value: /code/pelias.json
        volumeMounts:
        - name: config
          mountPath: /code/pelias.json
          subPath: pelias.json
          readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 256Mi
          limits:
            memory: 2Gi
            ephemeral-storage: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: pelias-config
