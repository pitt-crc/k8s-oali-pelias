apiVersion: batch/v1
kind: Job
metadata:
  name: pelias-import-wof
  labels:
    app.kubernetes.io/part-of: pelias
    app.kubernetes.io/component: build
  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: pelias
        app.kubernetes.io/component: build
        pelias.io/uses-data: 'true'
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: pelias-import-wof
        image: pelias/whosonfirst:master
        command:
        - ./bin/start
        env:
        - name: PELIAS_CONFIG
          value: /code/pelias.json
        volumeMounts:
        - name: config
          mountPath: /code/pelias.json
          subPath: pelias.json
          readOnly: true
        - name: data
          mountPath: /data
          readOnly: false
        - name: blacklist
          mountPath: /data/blacklist/osm.txt
          subPath: osm.txt
          readOnly: true
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
            ephemeral-storage: 1Gi
          limits:
            memory: 6Gi
            ephemeral-storage: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: pelias-config
      - name: data
        persistentVolumeClaim:
          claimName: pelias-data
      - name: blacklist
        configMap:
          name: pelias-osm-blacklist
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                pelias.io/uses-data: 'true'
            topologyKey: kubernetes.io/hostname
---
