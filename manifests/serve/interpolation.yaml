apiVersion: apps/v1
kind: Deployment
metadata:
  name: interpolation
  labels:
    app.kubernetes.io/part-of: pelias
    app.kubernetes.io/component: serve
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: interpolation
  template:
    metadata:
      labels:
        app: interpolation
        app.kubernetes.io/part-of: pelias
        app.kubernetes.io/component: serve
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: interpolation
        image: pelias/interpolation:master
        ports:
        - containerPort: 4300
          name: http
        env:
        - name: PORT
          value: '4300'
        readinessProbe:
          tcpSocket:
            port: 4300
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 4300
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /code/pelias.json
          subPath: pelias.json
          readOnly: true
        - name: data
          mountPath: /data
          readOnly: false
      volumes:
      - name: config
        configMap:
          name: pelias-config
      - name: data
        persistentVolumeClaim:
          claimName: pelias-data
---
apiVersion: v1
kind: Service
metadata:
  name: interpolation
  labels:
    app.kubernetes.io/part-of: pelias
    app.kubernetes.io/component: serve
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  selector:
    app: interpolation
  ports:
  - name: http
    port: 4300
    targetPort: 4300
